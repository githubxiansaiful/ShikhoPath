services:
  postgres:
    image: postgres:17-alpine
    container_name: shikhopath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shikhopath
    ports:
      - "5434:5432"
    volumes:
      - shikhopath_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shikhopath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shikhopath_redis_data:/data

volumes:
  shikhopath_pg_data:
    driver: local
  shikhopath_redis_data:
    driver: local
